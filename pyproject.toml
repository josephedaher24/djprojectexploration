[project]
name = "djprojectexploration"
version = "0.1.0"
description = "Exploration project scaffolded with uv."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.9.18",
    "appnope==0.1.4 ; sys_platform == 'darwin'",
    "debugpy==1.8.20",
    "essentia>=2.1b6.dev1389",
    "essentia-tensorflow>=2.1b6.dev1389",
    "ipykernel==7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter-client==8.8.0",
    "kaleido>=1.3.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.8",
    "mutagen>=1.48.1",
    "nbformat>=5.10.4",
    "nest-asyncio==1.6.0",
    "numpy>=2.4.3",
    "pacmap",
    "plotly>=6.6.0",
    "psutil==7.2.2",
    "pyloudnorm",
    "pyzmq==27.1.0",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
    "tensorflow>=2.15.0",
    "tornado==6.5.5",
    "umap-learn>=0.5.12",
]

[project.scripts]
djprojectexploration = "djprojectexploration.essentia_feature_extractor:main"
djprojectexploration-maest = "djprojectexploration.maest_embedding_extractor:main"
djprojectexploration-chroma = "djprojectexploration.chroma_embedding_extractor:main"
djprojectexploration-tempo = "djprojectexploration.tempo_embedding_extractor:main"
djprojectexploration-groove = "djprojectexploration.groove_embedding_extractor:main"
djprojectexploration-deam = "djprojectexploration.deam_embedding_extractor:main"
djprojectexploration-maest-playlist = "djprojectexploration.playlist_embedding_pipeline:maest_main"
djprojectexploration-chroma-playlist = "djprojectexploration.playlist_embedding_pipeline:chroma_main"
djprojectexploration-tempo-playlist = "djprojectexploration.playlist_embedding_pipeline:tempo_main"
djprojectexploration-groove-playlist = "djprojectexploration.playlist_embedding_pipeline:groove_main"
djprojectexploration-deam-playlist = "djprojectexploration.playlist_embedding_pipeline:deam_main"
djprojectexploration-snippet-cache = "djprojectexploration.audio_snippets:main"
djprojectexploration-preview-sections = "djprojectexploration.preview_sections:main"
djprojectexploration-rekordbox-cues = "djprojectexploration.rekordbox_cue_importer:main"
djprojectexploration-transition-preview = "djprojectexploration.transition_preview:main"
djprojectexploration-transition-visualizer = "djprojectexploration.transition_visualizer:main"
djprojectexploration-transition-workbench = "djprojectexploration.transition_workbench:main"
djprojectexploration-dj-sequence = "djprojectexploration.energy_sequence_builder:main"
djprojectexploration-energy-sequence-builder = "djprojectexploration.energy_sequence_builder:main"
djprojectexploration-energy-features = "djprojectexploration.energy_features:main"
djprojectexploration-waveforms = "djprojectexploration.waveform_features:main"
djprojectexploration-sequence-builder-app = "djprojectexploration.sequence_builder_app:main"
djprojectexploration-umap-precomputed = "djprojectexploration.interactive_umap_precomputed:main"
djprojectexploration-pacmap-knn = "djprojectexploration.interactive_pacmap_knn:main"
djprojectexploration-umap-simplex = "djprojectexploration.interactive_umap_simplex:main"
djprojectexploration-dj-pacmap = "djprojectexploration.interactive_pacmap_knn_simplex:main"
djprojectexploration-pacmap-knn-simplex = "djprojectexploration.interactive_pacmap_knn_simplex:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
